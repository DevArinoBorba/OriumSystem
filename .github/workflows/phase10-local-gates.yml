name: phase10-local-gates

# CI real (Gate 8) da Fase 10 — pipeline de gates fail-closed, executado no
# GitHub Actions. YAML + execução comprovada por rede/máquina; nenhum segredo
# passado ao workflow; deploy/ e QA artifacts necessários para a execução.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  phase10-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint (deploy/verification + tests/phase10)
        run: pnpm exec eslint deploy/verification tests/phase10
      - name: TypeScript typecheck (root)
        run: pnpm run typecheck
      - name: Phase 10 test suite
        run: pnpm vitest run tests/phase10/
      - name: Release pipeline (fail-closed local)
        run: node deploy/operations/run-pipeline.mjs production
